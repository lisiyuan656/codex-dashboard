[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-dashboard"
version = "0.1.0"
description = "A self-hosted dashboard and control plane for distributed Codex CLI instances."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[project.scripts]
codex-dashboard-server = "codex_dashboard.main:run"
codex-dashboard-agent = "codex_dashboard.agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
