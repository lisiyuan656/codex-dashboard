services:
  codex-dashboard-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: codex-dashboard-server:latest
    container_name: codex-dashboard-server
    restart: unless-stopped
    ports:
      - "${CODEX_DASHBOARD_SERVER_PORT:-8000}:8000"
    environment:
      CODEX_DASHBOARD_DATABASE_URL: "${CODEX_DASHBOARD_DATABASE_URL:-sqlite:////var/lib/codex-dashboard/codex_dashboard.db}"
      CODEX_DASHBOARD_SECRET_KEY: "${CODEX_DASHBOARD_SECRET_KEY:?set in docker/server.env}"
      CODEX_DASHBOARD_SESSION_COOKIE: "${CODEX_DASHBOARD_SESSION_COOKIE:-codex_dashboard_session}"
      CODEX_DASHBOARD_ADMIN_USERNAME: "${CODEX_DASHBOARD_ADMIN_USERNAME:-admin}"
      CODEX_DASHBOARD_ADMIN_PASSWORD: "${CODEX_DASHBOARD_ADMIN_PASSWORD:?set in docker/server.env}"
      CODEX_DASHBOARD_AGENT_SHARED_SECRET: "${CODEX_DASHBOARD_AGENT_SHARED_SECRET:?set in docker/server.env}"
      CODEX_DASHBOARD_OFFLINE_AGENT_SECONDS: "${CODEX_DASHBOARD_OFFLINE_AGENT_SECONDS:-60}"
      CODEX_DASHBOARD_STALE_SESSION_SECONDS: "${CODEX_DASHBOARD_STALE_SESSION_SECONDS:-45}"
    volumes:
      - type: bind
        source: "${CODEX_DASHBOARD_DATA_DIR:-./docker/data}"
        target: /var/lib/codex-dashboard
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
